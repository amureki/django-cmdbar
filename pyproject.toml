[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djangonaut"
version = "0.0.1"
description = "A Raycast-style command palette for Django admin."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rustem Saiargaliev" }]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["Django>=5.2"]

[project.urls]
Homepage = "https://github.com/amureki/djangonaut"

[tool.hatch.build.targets.wheel]
packages = ["src/djangonaut"]

[tool.hatch.build.targets.sdist]
include = ["src/djangonaut", "README.md", "pyproject.toml"]
