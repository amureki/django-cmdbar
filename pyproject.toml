[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-cmdbar"
version = "0.1.0"
description = "Keyboard navigation for Django admin models and records."
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [ "django>=5.2" ]
[[project.authors]]
name = "Rustem Saiargaliev"
[project.urls]
Homepage = "https://github.com/amureki/django-cmdbar"

[dependency-groups]
dev = [
  "pytest",
  "pytest-django",
  "pytest-playwright-asyncio",
  "ruff",
]

[tool.hatch.build.targets.sdist]
include = [ "src/django_cmdbar", "tests", "README.md", "pyproject.toml", "LICENSE" ]
[tool.hatch.build.targets.wheel]
packages = [ "src/django_cmdbar" ]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = [ "E", "F", "I", "UP" ]

[tool.pytest.ini_options]
pythonpath = [ "src", "." ]
python_files = [ "test_*.py" ]
filterwarnings = [ "error" ]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "tests.settings"
